name: Factory reusable workflow access probe (no agent)
on:
  push:
    branches: [test/factory-reuse-access-20261121]

# Diagnostic only; deliberately skip any Copilot-capable reusable workflow.
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: write

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm caller workflow executes
        run: echo 'Local diagnostic started; no model or publication requested.'
  remote_review_reference:
    if: ${{ false }}
    uses: grove/factory/.github/workflows/sfstack-review.lock.yml@550832359160e49e0824010cbd9c7e8f84b32589
    with:
      head-sha: 72ed87e077074ab500d1db809eb48b154f1fee6a

  remote_quality_reference:
    # Match the sfstack manual caller's exact top-level default-branch gate.
    # On this diagnostic push ref, the job must be skipped with no agent run.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: grove/factory/.github/workflows/sfstack-quality.yml@550832359160e49e0824010cbd9c7e8f84b32589
    with:
      pr-number: 37
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
