name: Factory reusable workflow access probe (no agent)
on:
  push:
    branches: [test/factory-reuse-access-20261121]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

jobs:
  preflight:
    name: Confirm diagnostic is on a non-default branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Verify this run cannot pass Factory default-branch admission
        env:
          DEFAULT_REF: ${{ format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: test "$GITHUB_REF" != "$DEFAULT_REF"

  remote_quality_reference:
    name: Try pinned Factory reusable jobs with preflight dependency
    needs: preflight
    uses: grove/factory/.github/workflows/sfstack-quality.yml@550832359160e49e0824010cbd9c7e8f84b32589
    with:
      pr-number: 37
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
