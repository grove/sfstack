name: sfstack quality events

# No PR checkout, candidate execution, or artifact evaluation occurs here.
# workflow_run loads this workflow from the default branch. The push trigger
# refreshes assessments after the protected base moves.
on:
  workflow_run:
    workflows: [sfstack PR signal, sfstack GitHub quality]
    types: [in_progress, completed]
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    name: Dispatch current PR assessments
    if: >-
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
       github.event.workflow_run.name == 'sfstack PR signal' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
      checks: write
    concurrency:
      group: sfstack-quality-publication-${{ github.repository }}
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Resolve fresh candidates and dispatch the trusted controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python controller/integrations/github/automation.py dispatch
          --event "$GITHUB_EVENT_PATH"

  reconcile:
    name: Reconcile interrupted PR checks
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'sfstack GitHub quality'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    concurrency:
      group: sfstack-quality-publication-${{ github.repository }}
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Close interrupted or superseded check ownership without granting a pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python controller/integrations/github/automation.py reconcile
          --event "$GITHUB_EVENT_PATH"
