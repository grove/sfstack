name: Validate sfstack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate packages, contracts, workflows, and documentation
        run: python tools/validate.py
      - name: Check shared standalone resources
        run: python tools/sync_protocol.py --check
      - name: Exercise gates and portability regressions
        run: python -m unittest discover -s tests -v
      - name: Exercise real quality verification and retain evidence
        if: matrix.python-version == '3.11'
        run: python evals/run_quality_regression.py --output dist/quality-regression
      - name: Upload quality regression evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-regression
          path: dist/quality-regression
          if-no-files-found: error
          retention-days: 14
      - name: Exercise the GitHub contract handoff with defective and fixed candidates
        if: matrix.python-version == '3.11'
        run: python evals/run_github_regression.py --output dist/github-regression
      - name: Upload GitHub integration regression evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-regression
          path: dist/github-regression
          if-no-files-found: error
          retention-days: 14
      - name: Verify all standalone exports
        run: python tools/export_skills.py --output dist/skills

  agentic_workflows:
    name: Validate Agentic Workflows compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read pinned compiler identity
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          pin = json.loads(Path('.github/aw/compiler.json').read_text())
          version = pin['version']
          digest = pin['linux_amd64_sha256']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Expected a pinned gh-aw release')
          if not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('Expected a SHA-256 compiler digest')
          url = f'https://github.com/github/gh-aw/releases/download/{version}/linux-amd64'
          if pin['linux_amd64_url'] != url:
              raise SystemExit('Compiler URL must identify the pinned official release')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'GH_AW_COMPILER_URL={url}\nGH_AW_COMPILER_SHA={digest}\n')
          PY
      - name: Download and verify the compiler
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "$GH_AW_COMPILER_URL" --output "$RUNNER_TEMP/gh-aw"
          printf '%s  %s\n' "$GH_AW_COMPILER_SHA" "$RUNNER_TEMP/gh-aw" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/gh-aw"
      - name: Compile the authored workflow and detect drift
        run: |
          "$RUNNER_TEMP/gh-aw" compile sfstack-review --strict --no-check-update --no-logo
          git diff --exit-code -- .github/workflows/sfstack-review.lock.yml .github/aw/actions-lock.json
      # Temporary: export the compiler-generated lock for the admission hotfix.
      - name: Export compiled lock for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gh-aw-compiled-admission
          path: |
            .github/workflows/sfstack-review.lock.yml
            .github/aw/actions-lock.json
          if-no-files-found: error
          retention-days: 1
