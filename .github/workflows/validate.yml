name: Validate sfstack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate packages, contracts, workflows, and documentation
        run: python tools/validate.py
      - name: Check shared standalone resources
        run: python tools/sync_protocol.py --check
      - name: Exercise gates and portability regressions
        run: python -m unittest discover -s tests -v
      - name: Exercise real quality verification and retain evidence
        if: matrix.python-version == '3.11'
        run: python evals/run_quality_regression.py --output dist/quality-regression
      - name: Upload quality regression evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-regression
          path: dist/quality-regression
          if-no-files-found: error
          retention-days: 14
      - name: Verify all standalone exports
        run: python tools/export_skills.py --output dist/skills

  external_consumer:
    name: Install pinned CLI wheel and test outside the checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Exercise versioned public interface from an isolated external consumer
        run: bash tests/external_consumer/run.sh
