name: Validate sfstack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate packages, contracts, workflows, and documentation
        run: python tools/validate.py
      - name: Check shared standalone resources
        run: python tools/sync_protocol.py --check
      - name: Exercise gates and portability regressions
        run: python -m unittest discover -s tests -v
      - name: Verify all standalone exports
        run: python tools/export_skills.py --output dist/skills
