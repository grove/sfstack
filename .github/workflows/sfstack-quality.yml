name: sfstack GitHub quality

# The metadata-only event coordinator dispatches this trusted controller.
# Manual dispatch remains available from the current default branch.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open pull request in this repository to assess
        required: true
        type: number
      expected-head:
        description: Optional immutable PR head required by automatic dispatch
        required: false
        type: string
      expected-base:
        description: Optional immutable base required by automatic dispatch
        required: false
        type: string
      request-id:
        description: Automatic dispatch identity; leave empty for manual runs
        required: false
        type: string

run-name: "sfstack quality / PR #${{ inputs.pr-number }} / request ${{ inputs.request-id || 'manual' }}"

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # A delayed old dispatch must not cancel a newer PR run before ownership is
  # checked. Superseded runs may finish, but only the current owner can publish.
  group: sfstack-quality-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  start_check:
    name: Start the PR quality check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    # Every check writer uses this same lock. queue:max retains pending writers.
    concurrency:
      group: sfstack-quality-publication-${{ github.repository }}
      queue: max
    outputs:
      head-sha: ${{ steps.start.outputs.head_sha }}
      base-sha: ${{ steps.start.outputs.base_sha }}
      pr-number: ${{ steps.start.outputs.pr_number }}
      check-id: ${{ steps.start.outputs.check_id }}
      eligible: ${{ steps.start.outputs.eligible }}
    steps:
      - name: Require the trusted default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo '::error::Dispatch this workflow from the default branch.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Pin current PR identity and acquire the check
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          EXPECTED_HEAD: ${{ inputs.expected-head }}
          EXPECTED_BASE: ${{ inputs.expected-base }}
          REQUEST_ID: ${{ inputs.request-id }}
        run: >-
          python controller/integrations/github/automation.py start
          --pr-number "$PR_NUMBER" --expected-head "$EXPECTED_HEAD"
          --expected-base "$EXPECTED_BASE" --request-id "$REQUEST_ID"
          --out publication.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfstack-publication-${{ github.run_attempt }}
          path: |
            publication.json
            pr.json
          if-no-files-found: error
          retention-days: 14

  prepare:
    name: Pin candidate and contracts
    needs: start_check
    if: needs.start_check.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head-sha: ${{ needs.start_check.outputs.head-sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfstack-publication-${{ github.run_attempt }}
          path: publication
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.start_check.outputs.head-sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install controller dependencies
        run: python -m pip install -r controller/requirements-dev.txt
      - name: Prepare immutable sfstack inputs
        run: >-
          python controller/integrations/github/quality.py prepare
          --repo candidate --pr publication/pr.json --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --out inputs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfstack-inputs-${{ github.run_attempt }}
          path: inputs
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Execute pinned verification
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.head-sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install controller dependencies
        run: python -m pip install -r controller/requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfstack-inputs-${{ github.run_attempt }}
          path: inputs
      - name: Verify candidate and retain negative results
        run: >-
          python controller/integrations/github/quality.py verify
          --repo candidate --bundle inputs --out verification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sfstack-verification-${{ github.run_attempt }}
          path: verification
          if-no-files-found: error
          retention-days: 14

  review:
    name: Review through Agentic Workflows
    needs: [prepare, verify]
    uses: ./.github/workflows/sfstack-review.lock.yml
    with:
      head-sha: ${{ needs.prepare.outputs.head-sha }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  quality_gate:
    name: sfstack quality gate
    needs: [start_check, prepare, verify, review]
    # A skipped reusable workflow or missing submission must never be a pass.
    if: always() && needs.start_check.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install controller dependencies
        run: python -m pip install -r controller/requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sfstack-inputs-${{ github.run_attempt }}
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sfstack-verification-${{ github.run_attempt }}
          path: verification
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sfstack-agent-review-${{ github.run_attempt }}
          path: agent-review
      - name: Re-read the pull request before applying the gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
      - name: Validate evidence and apply sfstack quality policy
        env:
          AW_RESULT: ${{ needs.review.result }}
        run: >-
          python controller/integrations/github/quality.py finalize
          --bundle inputs --verification verification
          --review agent-review/submission.json --current-pr current-pr.json
          --agent-result "$AW_RESULT" --out result
      - name: Write the quality summary
        if: always()
        run: |
          if [ -f result/summary.md ]; then
            cat result/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'sfstack could not produce an assessment; inspect the failed prerequisite.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sfstack-quality-${{ github.run_attempt }}
          path: result
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the PR quality check
    needs: [start_check, quality_gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    concurrency:
      group: sfstack-quality-publication-${{ github.repository }}
      queue: max
    steps:
      - name: Require the trusted default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo '::error::Dispatch this workflow from the default branch.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sfstack-publication-${{ github.run_attempt }}
          path: publication
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sfstack-quality-${{ github.run_attempt }}
          path: result
      - name: Publish only a current, validated assessment
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.quality_gate.result }}
        run: >-
          python controller/integrations/github/automation.py publish
          --publication publication/publication.json --result result
          --gate-result "$GATE_RESULT" --out check-publication.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sfstack-check-publication-${{ github.run_attempt }}
          path: check-publication.json
          if-no-files-found: error
          retention-days: 14
