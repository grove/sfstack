name: sfstack GitHub quality

# This is an opt-in reference integration. The dispatch gate belongs to the
# workflow run; it is not automatically a required check on the reviewed PR.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Open pull request in this repository to assess
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: sfstack-quality-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Pin candidate and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head-sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Require the trusted default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo '::error::Dispatch this workflow from the default branch.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Resolve the current pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          pr = json.loads(Path('pr.json').read_text())
          sha = pr['head']['sha']
          repository = pr['head']['repo']['full_name']
          if pr['state'] != 'open' or pr['base']['repo']['full_name'] != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('Expected an open pull request in this repository')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Expected a full Git commit SHA')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise SystemExit('Invalid candidate repository')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'head_sha={sha}\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Install controller dependencies
        run: python -m pip install -r controller/requirements-dev.txt
      - name: Prepare immutable sfstack inputs
        run: >-
          python controller/integrations/github/quality.py prepare
          --repo candidate --pr pr.json --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --out inputs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfstack-inputs-${{ github.run_attempt }}
          path: inputs
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Execute pinned verification
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.head-sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install controller dependencies
        run: python -m pip install -r controller/requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfstack-inputs-${{ github.run_attempt }}
          path: inputs
      - name: Verify candidate and retain negative results
        run: >-
          python controller/integrations/github/quality.py verify
          --repo candidate --bundle inputs --out verification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sfstack-verification-${{ github.run_attempt }}
          path: verification
          if-no-files-found: error
          retention-days: 14

  review:
    name: Review through Agentic Workflows
    needs: [prepare, verify]
    uses: ./.github/workflows/sfstack-review.lock.yml
    with:
      head-sha: ${{ needs.prepare.outputs.head-sha }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  quality_gate:
    name: sfstack quality gate
    needs: [prepare, verify, review]
    # A skipped reusable workflow or missing submission must never be a pass.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install controller dependencies
        run: python -m pip install -r controller/requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sfstack-inputs-${{ github.run_attempt }}
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sfstack-verification-${{ github.run_attempt }}
          path: verification
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sfstack-agent-review-${{ github.run_attempt }}
          path: agent-review
      - name: Re-read the pull request before applying the gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > current-pr.json
      - name: Validate evidence and apply sfstack quality policy
        env:
          AW_RESULT: ${{ needs.review.result }}
        run: >-
          python controller/integrations/github/quality.py finalize
          --bundle inputs --verification verification
          --review agent-review/submission.json --current-pr current-pr.json
          --agent-result "$AW_RESULT" --out result
      - name: Write the quality summary
        if: always()
        run: |
          if [ -f result/summary.md ]; then
            cat result/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'sfstack could not produce an assessment; inspect the failed prerequisite.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sfstack-quality-${{ github.run_attempt }}
          path: result
          if-no-files-found: error
          retention-days: 14
