name: sfstack PR signal

# This low-trust workflow only supplies a GitHub-authenticated event. The
# default-branch coordinator resolves identity through the API, not an artifact.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  signal:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Signal that the PR needs assessment
        run: echo 'The trusted sfstack coordinator will resolve the current PR through GitHub.'
