name: sfstack issue-label Software Factory

# Issue prose is untrusted. A writer's label creates a durable scoped claim.
# factory:plan is optional paid AI advice; it never starts implementation.
# factory:run authorizes one paid build, directly if no plan was requested,
# or only after a separately validated AI plan when planning was requested.
on:
  issues:
    types: [labeled]

run-name: "sfstack issue #${{ github.event.issue.number }} / ${{ github.event.label.name }}"
permissions: {}

# One workflow-level lock serializes all plan/run label events for one issue.
# The downstream publisher retains its own independent Quality writer lock.
concurrency:
  group: sfstack-issue-label-${{ github.repository }}-${{ github.event.issue.number }}
  queue: max

jobs:
  authorize:
    name: Validate human labeler and exact issue scope; claim before build
    if: >-
      github.repository == 'grove/sfstack' &&
      (github.event.label.name == 'factory:plan' || github.event.label.name == 'factory:run') &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      authorized: ${{ steps.label.outputs.authorized }}
      plan_requested: ${{ steps.label.outputs.plan_requested }}
      issue_number: ${{ steps.label.outputs.issue_number }}
      allowed_paths: ${{ steps.label.outputs.allowed_paths }}
      acceptance_criteria: ${{ steps.label.outputs.acceptance_criteria }}
      repair_mode: ${{ steps.label.outputs.repair_mode }}
      regression_file: ${{ steps.label.outputs.regression_file }}
    steps:
      - name: Load only reviewed immutable Factory coordinator source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: grove/factory
          ref: 8164f2e5a6c122e81e2fac43bc31f5933c8012fa
          path: controller
          persist-credentials: false
      - name: Checkout default-branch source solely for bounded read-only planning excerpts
        if: github.event.label.name == 'factory:plan'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned portable contract CLI
        run: python controller/tools/bootstrap_contracts.py
      - name: Authenticate label, post plan or durable one-shot claim
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
        run: python controller/integrations/github/issue_labels.py --out authorization.json --candidate candidate
      - name: Retain only exact authorized planning inputs
        if: steps.label.outputs.plan_requested == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfstack-ai-plan-inputs-${{ github.run_attempt }}
          path: authorization.json
          if-no-files-found: error
          retention-days: 14

  plan:
    name: Generate actionable Copilot implementation proposal (paid, no writes)
    needs: authorize
    if: needs.authorize.result == 'success' && needs.authorize.outputs.plan_requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfstack-ai-plan-inputs-${{ github.run_attempt }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install a fixed Copilot CLI version
        run: npm install -g @github/copilot@1.0.114
      - name: Read only the pinned prompt and capture untrusted planning JSON
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_AUTO_UPDATE: 'false'
          COPILOT_HOME: ${{ runner.temp }}/sfstack-plan-home
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json,pathlib; x=json.loads(pathlib.Path("authorization.json").read_text()); pathlib.Path("prompt.txt").write_text(x["planning_prompt"],encoding="utf-8")'
          # No built-in MCPs, arbitrary shell, edit, write or repo API tools.
          copilot -p "$(cat prompt.txt)" --silent --no-auto-update \
            --no-ask-user --no-custom-instructions --disable-builtin-mcps \
            --available-tools=view --deny-tool=write > plan-response.json
      - name: Retain raw advisory output (not an authorized plan)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfstack-ai-plan-proposal-${{ github.run_attempt }}
          path: plan-response.json
          if-no-files-found: error
          retention-days: 14

  publish_plan:
    name: Revalidate exact issue and publish bounded human-reviewable plan
    needs: [authorize, plan]
    if: needs.authorize.result == 'success' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: grove/factory
          ref: 8164f2e5a6c122e81e2fac43bc31f5933c8012fa
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install locked contract runtime for independent AI-plan validation
        run: python controller/tools/bootstrap_contracts.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfstack-ai-plan-proposal-${{ github.run_attempt }}
          path: ai-plan
      - name: Independently validate and publish (no model secret)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python controller/integrations/github/issue_labels.py
          --publish-ai --proposal ai-plan/plan-response.json --out published-plan.json

  software:
    name: Execute pinned, already-authorized Software Factory
    needs: authorize
    if: needs.authorize.result == 'success' && needs.authorize.outputs.authorized == 'true'
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
      checks: write
    uses: grove/factory/.github/workflows/sfstack-software.yml@8164f2e5a6c122e81e2fac43bc31f5933c8012fa
    with:
      issue-number: ${{ fromJSON(needs.authorize.outputs.issue_number) }}
      allowed-paths: ${{ needs.authorize.outputs.allowed_paths }}
      acceptance-criteria: ${{ needs.authorize.outputs.acceptance_criteria }}
      repair-mode: ${{ needs.authorize.outputs.repair_mode }}
      regression-file: ${{ needs.authorize.outputs.regression_file }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
