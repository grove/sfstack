name: sfstack GitHub software

# A maintainer explicitly chooses one issue, exact files, and acceptance criteria.
# Candidate execution never shares the draft-PR publisher's write permissions.
on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Open issue in this repository to implement
        required: true
        type: number
      allowed-paths:
        description: 'JSON array of exact permitted files, e.g. ["README.md"]'
        required: true
        type: string
      acceptance-criteria:
        description: 'JSON array of required outcomes, e.g. ["Document retry recovery steps."]'
        required: true
        type: string

run-name: "sfstack software / issue #${{ inputs.issue-number }}"

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: sfstack-software-${{ github.repository }}-${{ inputs.issue-number }}
  queue: max

jobs:
  prepare:
    name: Admit the issue and pin the work item
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base-sha: ${{ steps.prepare.outputs.base_sha }}
      issue-number: ${{ steps.prepare.outputs.issue_number }}
    steps:
      - name: Require the trusted default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo '::error::Dispatch this workflow from the default branch.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install controller dependencies
        run: python -m pip install -r controller/requirements-dev.txt
      - name: Validate the maintainer request and retain immutable inputs
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          ALLOWED_PATHS: ${{ inputs.allowed-paths }}
          ACCEPTANCE_CRITERIA: ${{ inputs.acceptance-criteria }}
        run: >-
          python controller/integrations/github/software.py prepare
          --repo controller --issue-number "$ISSUE_NUMBER"
          --allowed-paths "$ALLOWED_PATHS"
          --acceptance-criteria "$ACCEPTANCE_CRITERIA" --out inputs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfstack-software-inputs-${{ github.run_attempt }}
          path: inputs
          if-no-files-found: error
          retention-days: 14

  build:
    name: Implement through Agentic Workflows
    needs: prepare
    uses: ./.github/workflows/sfstack-build.lock.yml
    with:
      base-sha: ${{ needs.prepare.outputs.base-sha }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  verify:
    name: Apply and verify the bounded proposal
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.base-sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install controller dependencies
        run: python -m pip install -r controller/requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfstack-software-inputs-${{ github.run_attempt }}
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: sfstack-agent-change-${{ github.run_attempt }}
          path: agent-change
      - name: Verify the fresh candidate and retain negative evidence
        id: verify
        env:
          AGENT_RESULT: ${{ needs.build.result }}
        run: >-
          python controller/integrations/github/software.py verify
          --bundle inputs --submission agent-change/submission.json
          --agent-result "$AGENT_RESULT" --repo candidate --out result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sfstack-software-result-${{ github.run_attempt }}
          path: result
          if-no-files-found: error
          retention-days: 14
      - name: Summarize software evidence
        if: always()
        run: |
          if test -f result/summary.md; then
            cat result/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Open a draft PR and request quality assessment
    needs: [prepare, verify]
    if: needs.verify.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install controller dependencies
        run: python -m pip install -r controller/requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfstack-software-inputs-${{ github.run_attempt }}
          path: inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfstack-software-result-${{ github.run_attempt }}
          path: result
      - name: Revalidate evidence, publish the draft, and dispatch quality
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python controller/integrations/github/software.py publish
          --bundle inputs --result result --out publication.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sfstack-software-publication-${{ github.run_attempt }}
          path: publication.json
          if-no-files-found: error
          retention-days: 14
